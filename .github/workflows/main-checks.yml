name: Main checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Format and tests on Windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check code formatting
        shell: bash
        run: sh .githooks/check-format

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Run tests
        run: npm test
