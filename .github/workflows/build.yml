name: Release build

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win -- --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: markdown-studio-windows-x64
          path: release/* Setup *.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Test and package macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: markdown-studio-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          compression-level: 0
