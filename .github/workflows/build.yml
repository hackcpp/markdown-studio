name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win -- --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: markdown-studio-windows-x64
          path: release/* Setup *.exe
          if-no-files-found: error
          compression-level: 0
